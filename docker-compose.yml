name: saku-keluarga

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saku}
      POSTGRES_DB: ${POSTGRES_DB:-saku}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Menyiapkan volume log & backup agar bisa ditulis container non-root (uid 1000).
  logs-init:
    image: node:22-bookworm-slim
    restart: "no"
    user: "0:0"
    command:
      [
        "sh",
        "-c",
        "mkdir -p /logs /backups && chown -R 1000:1000 /logs /backups && chmod 0770 /logs /backups",
      ]
    security_opt:
      - no-new-privileges:true
    volumes:
      - logs-data:/logs
      - backups-data:/backups
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-saku}:${POSTGRES_PASSWORD:-saku}@db:5432/${POSTGRES_DB:-saku}?schema=public
      WA_BOT_URL: http://wa:3002
      LOG_DIR: /logs
      WEB_LOG_DIR: /logs
      BACKUP_DIR: /backups
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - logs-data:/logs
      - backups-data:/backups
    depends_on:
      db:
        condition: service_healthy
      logs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wa:
    build:
      context: .
      dockerfile: apps/wa/Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-saku}:${POSTGRES_PASSWORD:-saku}@db:5432/${POSTGRES_DB:-saku}?schema=public
      BOT_HTTP_PORT: 3002
      WA_LOG_DIR: /logs
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    volumes:
      - wa-auth:/data/auth
      - logs-data:/logs
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
      logs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
  wa-auth:
  logs-data:
  backups-data:
